# EXE 만들기 — GitHub의 윈도우 컴퓨터에서 한다. 빌드 찌꺼기(src-tauri/target, 수 GB)는 거기서만 생기고 끝나면 사라진다.
# - 태그 v1.3.0처럼 "v + tauri.conf.json 버전"을 올리면: EXE를 만들어 Releases에 POWER-CHART-AND-BACKTEST.exe로 올린다
# - Actions 탭 → "EXE 만들기" → Run workflow: EXE를 만들어 그 실행 기록의 Artifacts에만 둔다 (Releases에는 안 올림, 시험용)
# 처음은 20분쯤 (tauri-cli·의존성을 처음 빌드), 그 뒤는 캐시로 더 빠르다
name: EXE 만들기

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # Releases에 EXE 올리기

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: tauri-cli 설치 (캐시에 있으면 건너뜀)
        run: cargo install tauri-cli --version "^2" --locked

      - name: 태그와 버전이 같은지 (v1.3.0 = tauri.conf.json 1.3.0)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "태그 ${{ github.ref_name }}와 tauri.conf.json 버전 $v가 달라요" }

      - name: EXE 만들기
        working-directory: src-tauri
        run: cargo tauri build --no-bundle

      - name: 받기 쉬운 이름으로
        shell: pwsh
        run: Copy-Item src-tauri/target/release/power-chart-and-backtest.exe POWER-CHART-AND-BACKTEST.exe

      - uses: actions/upload-artifact@v4
        with:
          name: POWER-CHART-AND-BACKTEST
          path: POWER-CHART-AND-BACKTEST.exe

      - name: Releases에 올리기 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: POWER-CHART-AND-BACKTEST.exe
          body: |
            바뀐 것은 저장소의 CHANGELOG.md를 보세요.
            바꾸는 법: 앱을 끄고, 이 EXE를 원래 EXE 자리에 넣어 켜면 끝. 차트 데이터·관심종목·그린 것·키는 그대로 남아요 (%APPDATA%\power-chart-and-backtest).
            서명이 없는 EXE라 "Windows의 PC 보호"가 뜨면 "추가 정보 → 실행".
